name: daily

on:
  schedule:
    - cron: "0 19 * * *"  # 매일 04:00 KST
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: 국회의원 수집
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: python pipeline/collect_assembly.py
      # 적재(MERGE)·장관 수집·ISR 재검증 단계는 SQL 승인 후 추가
      - uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: pipeline/out/
